name: AXVARA CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: axvara-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Guard credentials
        shell: bash
        run: |
          if git ls-files | grep -Eq '(^|/)(\.cf-credentials|\.env\.local)$'; then
            echo "::error::Local credentials are tracked by Git."
            exit 1
          fi

      - name: Guard commit messages
        shell: bash
        run: |
          if git log -20 --format='%s %b' | grep -iE 'password.*(to |is |=|:)' | grep -qvE 'placeholder|rotate|guard|fix'; then
            echo "::warning::Possible plaintext password in a recent commit message."
          fi

      - name: Test
        run: npm test -- --run

      - name: Type-check
        run: npx tsc --noEmit

      - name: Verify WhatsApp gateway
        run: |
          npm ci --prefix gateway --no-audit --no-fund
          npm run build --prefix gateway
          npm test --prefix gateway

      - name: Check Pages variable limit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/ci-pages-env-check.cjs
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build Cloudflare Pages artifact
        run: npm run build:pages
        env:
          NEXT_PUBLIC_PAYMENTS_MAINTENANCE: "false"

      - name: Apply pending D1 migrations
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/ci-d1-migrations.cjs
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy WhatsApp gateway through Heroku API
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/ci-whatsapp-gateway.cjs
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY_AKUN1 }}

      - name: Deploy Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx --yes wrangler@4.128.0 pages deploy .vercel/output/static --project-name=axvara
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy MCP Worker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx --yes wrangler@4.128.0 deploy --config mcp-worker/wrangler.toml
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
