name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

      # Guard — no credentials in repo
      - name: Guard — no credentials in repo
        run: |
          if git ls-files | grep -q "^\.cf-credentials"; then
            echo "::error::.cf-credentials is tracked! Remove it from git."
            exit 1
          fi
