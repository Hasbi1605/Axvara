name = "axvara-mcp"
main = "src/index.ts"
compatibility_date = "2026-09-02"
workers_dev = true

# Ganti ke custom domain axvara.tech hanya setelah domain utama dipasang:
# [[routes]]
# pattern = "mcp.axvara.tech"
# custom_domain = true

[triggers]
crons = ["* * * * *"]

# Paid plan: bound CPU while network waits remain unbilled.
[limits]
cpu_ms = 1000

# Workers Logs (2026-11-20, owner): persistent logs 7 hari, dashboard Observability.
# Rollback: set enabled = false (JANGAN hapus blok — default Wrangler bisa menyala).
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = true

# State alarm cron (mulai/pengingat 6 jam/pulih) — 2026-10-04, KV gratis.
[[kv_namespaces]]
binding = "CRON_STATE"
id = "039698197aba4020b2f5af46b0fffc31"

[vars]
AXVARA_API_ORIGIN = "https://axvara.tech"
QUEUE_CONSUMER_MODE = "active"

# Queue pengiriman instan (Tahap C — resource dibuat manual sebelum deploy).
[[queues.consumers]]
queue = "axvara-order-fulfillment"
max_batch_size = 5
max_batch_timeout = 1
max_retries = 4
dead_letter_queue = "axvara-order-fulfillment-dlq"

[[queues.consumers]]
queue = "axvara-order-fulfillment-dlq"
max_batch_size = 5
max_batch_timeout = 5
max_retries = 2

# Queue pengiriman siaran/promo (resource dibuat manual sebelum deploy).
[[queues.consumers]]
queue = "axvara-broadcast"
max_batch_size = 10
max_batch_timeout = 1
max_concurrency = 1
max_retries = 3
dead_letter_queue = "axvara-broadcast-dlq"

[[queues.consumers]]
queue = "axvara-broadcast-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 2
